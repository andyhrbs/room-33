# Room 33 · réglages de l'espace /admin (Sveltia CMS)
# - Connexion : compte GitHub (jeton personnel limité au dépôt room-33).
# - Chaque « Enregistrer » crée un commit sur la branche dev → Netlify reconstruit le site dev (gratuit).
#   Quand le site passera en production, on remplacera « dev » par « main ».
# - Le contenu modifiable vit dans src/data/cms/ (fichiers JSON lus par le site au build).

backend:
  name: github
  repo: andyhrbs/room-33
  branch: dev
  commit_messages:
    create: 'Admin : ajoute {{collection}} « {{slug}} »'
    update: 'Admin : modifie {{collection}} « {{slug}} »'
    delete: 'Admin : supprime {{collection}} « {{slug}} »'
    uploadMedia: 'Admin : ajoute l’image {{path}}'
    deleteMedia: 'Admin : supprime l’image {{path}}'

site_url: https://dev--room-33.netlify.app
display_url: https://dev--room-33.netlify.app

# Images envoyées depuis l'admin
media_folder: public/images/cms
public_folder: /images/cms

collections:
  - name: disques
    label: Les disques
    label_singular: disque
    description: Un fichier par disque. Spotify ajoute tout seul la pochette, l'année, le label, les morceaux et le lien de l'artiste.
    folder: src/data/cms/disques
    extension: json
    format: json
    create: true
    delete: true
    identifier_field: titre
    slug: '{{artiste}}-{{titre}}'
    summary: '{{artiste}} — {{titre}}'
    sortable_fields: [artiste, titre, ajoute]
    fields:
      - { name: titre, label: Titre de l'album, widget: string }
      - { name: artiste, label: Artiste, widget: string, hint: "Classique : le compositeur, puis l'interprète (ex. Chopin · Martha Argerich)." }
      - name: genre
        label: Bac (genre)
        widget: relation
        collection: bacs
        file: liste
        search_fields: ['bacs.*.nom']
        display_fields: ['bacs.*.nom']
        value_field: 'bacs.*.nom'
        hint: Le disque est rangé automatiquement dans ce bac. Pour un nouveau genre, crée d'abord le bac dans « Les bacs ».
      - name: spotify
        label: Lien de l'album sur Spotify (conseillé)
        widget: string
        required: false
        pattern: ['^$|open\.spotify\.com/(intl-[a-z]{2}/)?album/', 'Colle un lien d’album Spotify (open.spotify.com/album/…)']
        hint: Dans Spotify, sur l'album → ⋯ → Partager → Copier le lien. Sans lien, Spotify cherche l'album par titre et artiste.
      - { name: annee, label: Année (si Spotify ne la trouve pas), widget: number, value_type: int, required: false, min: 1900, max: 2100 }
      - { name: avis, label: Mon avis, widget: text, required: false, hint: "3 à 5 phrases, comme une note de pochette. Garde les guillemets « »." }
      - { name: avisCourt, label: Mon avis (version courte, mobile), widget: string, required: false, hint: Une phrase. Vide = le début de l'avis complet. }
      - name: moment
        label: Le moment à écouter
        widget: object
        required: false
        fields:
          - { name: temps, label: À quel moment, widget: string, required: false, hint: 'Ex. 1:24' }
          - { name: texte, label: Ce qui se passe, widget: text, required: false, hint: Le passage qui t'accroche, en deux ou trois phrases. }
          - { name: texteCourt, label: Version courte (mobile), widget: string, required: false }
      - name: credits
        label: Crédits (notes de pochette)
        label_singular: crédit
        widget: list
        required: false
        summary: '{{fields.role}} — {{fields.nom}}'
        fields:
          - { name: role, label: Rôle, widget: string, hint: 'Ex. Basse, Claviers, Production' }
          - { name: nom, label: Nom, widget: string }
      - { name: bio, label: L'artiste en deux lignes, widget: text, required: false, hint: "D'où il vient, ce qu'il a changé, par quel disque commencer." }
      - { name: bioCourte, label: L'artiste (version courte, mobile), widget: string, required: false }
      - { name: ajoute, label: Ajouté le, widget: datetime, default: '{{now}}', hint: Sert à l'ordre des disques et au « mis à jour le » des bacs. }
      - { name: motif, label: Motif de démo, widget: hidden, required: false }

  - name: bacs
    label: Les bacs
    description: Un bac par genre ; il se remplit tout seul avec les disques de ce genre.
    files:
      - name: liste
        label: Mes bacs
        file: src/data/cms/bacs.json
        format: json
        fields:
          - name: bacs
            label: Bacs
            label_singular: bac
            widget: list
            summary: '{{fields.nom}}'
            fields:
              - { name: nom, label: Nom du bac (le genre), widget: string, hint: "Ex. Soul & R&B. Renommer un bac ne déplace pas ses disques : change aussi leur « Bac (genre) »." }
              - { name: description, label: Description, widget: text, hint: Une phrase sous le titre du bac. }
              - name: motif
                label: Motif de la pochette du bac
                widget: select
                options: [bandes, lune, arc, points, croix, cercles]
                default: points
              - { name: slug, label: Adresse, widget: hidden, required: false }
  - name: lives
    label: Les lives
    description: Les prestations live de la page Les lives. Le premier de la liste est « à la une » — glisse un live en haut pour le mettre à la une.
    files:
      - name: liste
        label: Mes lives
        file: src/data/cms/lives.json
        format: json
        fields:
          - name: lives
            label: Lives
            label_singular: live
            widget: list
            add_to_top: true
            summary: '{{fields.artiste}} — {{fields.titre}}'
            fields:
              - name: video
                label: Lien de la vidéo YouTube
                widget: string
                hint: Colle l'adresse de la vidéo (youtube.com/watch?v=…, youtu.be/…, /live/…). La vignette se fait toute seule.
                pattern: ['(youtube\.com|youtu\.be)/|^[\w-]{11}$', 'Colle un lien YouTube']
              - name: artiste
                label: Artiste
                widget: string
              - name: titre
                label: Titre du live
                widget: string
                hint: Par exemple « Tiny Desk Concert » ou « Live at Joshua Tree ».
              - name: lieu
                label: Émission, lieu, ville
                widget: string
                required: false
                hint: Par exemple « NPR Music · Washington ».
              - name: annee
                label: Année
                widget: number
                value_type: int
                min: 1950
                max: 2100
              - name: mot
                label: Mon mot
                widget: text
                hint: Une à trois phrases. Garde les guillemets « ».
  - name: top
    label: Le Top
    description: Le Top de la Room, page Le Top et accueil. Glisse les lignes pour changer le classement (la première = n° 1).
    files:
      - name: classement
        label: Mon classement
        file: src/data/cms/top.json
        format: json
        fields:
          - name: albums
            label: Albums (du n° 1 au n° 10)
            label_singular: album
            widget: list
            min: 1
            max: 10
            summary: '{{fields.disque}}'
            fields:
              - name: disque
                label: Disque
                widget: relation
                collection: disques
                value_field: '{{slug}}'
                search_fields: [titre, artiste]
                display_fields: [artiste, titre]
                hint: Le disque doit d'abord exister dans « Les disques ».
          - { name: pourquoiAlbum, label: Pourquoi l'album n° 1 est tout en haut, widget: text, required: false, hint: "Deux ou trois phrases, et le morceau à écouter en premier. Garde les guillemets « »." }
          - { name: pourquoiAlbumCourt, label: La même chose en une phrase (mobile), widget: string, required: false }
          - name: titres
            label: Titres (du n° 1 au n° 10)
            label_singular: titre
            widget: list
            min: 1
            max: 10
            summary: '{{fields.titre}}'
            fields:
              - { name: titre, label: Titre du morceau, widget: string, hint: "Écrit comme sur Spotify : la durée se retrouve toute seule." }
              - name: disque
                label: Disque où il se trouve
                widget: relation
                collection: disques
                value_field: '{{slug}}'
                search_fields: [titre, artiste]
                display_fields: [artiste, titre]
                hint: Le disque doit d'abord exister dans « Les disques ».
          - { name: pourquoiTitre, label: Pourquoi le titre n° 1 est tout en haut, widget: text, required: false, hint: Deux ou trois phrases. }
          - { name: pourquoiTitreCourt, label: La même chose en une phrase (mobile), widget: string, required: false }

  - name: accueil
    label: L'accueil
    description: Ce qui change sur la page d'accueil.
    files:
      - name: morceau
        label: Le morceau du moment
        file: src/data/cms/morceau.json
        format: json
        fields:
          - { name: titre, label: Titre du morceau, widget: string, hint: Écrit comme sur Spotify (c'est lui qui joue dans l'extrait). }
          - name: disque
            label: Disque où il se trouve
            widget: relation
            collection: disques
            value_field: '{{slug}}'
            search_fields: [titre, artiste]
            display_fields: [artiste, titre]
            hint: Sert pour la pochette et le lien « Voir la fiche ». Le disque doit d'abord exister dans « Les disques ».
          - { name: avis, label: Mon avis, widget: text, required: false, hint: "Deux phrases : pourquoi ce son en ce moment. Garde les guillemets « »." }
          - { name: avisCourt, label: Mon avis en une phrase (mobile), widget: string, required: false }

  - name: visiteurs
    label: Le bac des visiteurs
    description: Les recos reçues par e-mail (formulaire « Recommandez-moi un son ») que tu as validées. Spotify ajoute la pochette et l'année.
    files:
      - name: recos
        label: Les recos validées
        file: src/data/cms/visiteurs.json
        format: json
        fields:
          - name: recos
            label: Recos
            label_singular: reco
            widget: list
            add_to_top: true
            summary: '{{fields.prenom}} — {{fields.artiste}}, {{fields.titre}}'
            fields:
              - { name: prenom, label: Prénom du visiteur, widget: string, hint: Tel qu'il l'a écrit dans le formulaire. }
              - { name: titre, label: Titre du morceau, widget: string }
              - { name: artiste, label: Artiste, widget: string }
              - name: spotify
                label: Lien du morceau sur Spotify (conseillé)
                widget: string
                required: false
                pattern: ['^$|open\.spotify\.com/(intl-[a-z]{2}/)?track/', 'Colle un lien de morceau Spotify (open.spotify.com/track/…)']
                hint: "Si l'e-mail de la reco a un lien Spotify (champ « lien »), colle-le ici. Sinon, laisse vide : Spotify cherche le morceau par titre et artiste."
              - { name: ajoute, label: Ajouté le, widget: datetime, default: '{{now}}', hint: Sert à l'ordre (la plus récente en premier). }

  - name: reglages
    label: Réglages du site
    description: Les infos utilisées un peu partout sur le site.
    files:
      - name: site
        label: Réseaux (Instagram, Spotify)
        file: src/data/cms/site.json
        format: json
        fields:
          - name: instagram
            label: Pseudo Instagram
            widget: string
            hint: Avec le @ devant, par exemple @andyh.robinson. Sert pour tous les liens « Écrivez-moi en DM ».
            pattern: ['^@[A-Za-z0-9._]+$', 'Le pseudo commence par @ et ne contient que des lettres, chiffres, points ou _']
          - name: instagramUrl
            label: Lien du profil
            widget: string
            hint: L'adresse complète de ton profil, par exemple https://www.instagram.com/andyh.robinson/
            pattern: ['^https://(www\.)?instagram\.com/.+', 'Le lien doit commencer par https://www.instagram.com/']
          - name: spotifyUrl
            label: Lien du profil Spotify
            widget: string
            hint: Dans Spotify, ouvre ton profil, puis ⋯ → Partager → Copier le lien. Sert pour le lien « Spotify » du pied de page.
            pattern: ['^https://open\.spotify\.com/', 'Le lien doit commencer par https://open.spotify.com/']
